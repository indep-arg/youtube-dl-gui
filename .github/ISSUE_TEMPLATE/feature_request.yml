name: Feature request
description: An idea to make the app better.
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you would like
      description: What you want to do, and why it matters to you.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
