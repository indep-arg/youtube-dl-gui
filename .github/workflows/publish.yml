name: 'Publish'

on:
  workflow_dispatch:
  push:
    branches:
      - release

permissions:
  contents: read

jobs:
  # A broken release is worse than a failed one, so nothing is built until the
  # version is consistent and the same checks as CI pass.
  check-version:
    name: 'Check version'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check the version
        run: node scripts/check-version.ts

  verify-vue:
    name: 'Verify (Vue)'
    uses: ./.github/workflows/vue-ci.yml
    secrets: inherit

  verify-rust:
    name: 'Verify (Rust)'
    uses: ./.github/workflows/rust-ci.yml
    secrets: inherit

  publish-tauri:
    needs: [check-version, verify-vue, verify-rust]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-24.04'
            args: ''
          - platform: 'ubuntu-24.04-arm'
            args: ''
          - platform: 'windows-latest'
            args: ''
          - platform: 'windows-11-arm'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # patchelf and xvfb are used by the AppImage tooling, see setup-appimage-tauri-cli.
      - name: Install system dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        uses: ./.github/actions/install-tauri-deps
        with:
          extra-packages: patchelf xvfb

      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'

      - name: install Rust 1.99.1
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # rust-toolchain action
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.platform == 'windows-11-arm' && 'aarch64-pc-windows-msvc' || '' }}

      # Pinned by hand: Dependabot does not update tools installed like this.
      - name: Install cargo-about
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # Windows uses the tauri-cli from package.json through npm.
      - name: Set up the AppImage tauri-cli (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        uses: ./.github/actions/setup-appimage-tauri-cli

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'Open Video Downloader v__VERSION__'
          releaseBody: 'See the assets to download this version and install. If you have an existing install, it will auto-update on launch.'
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          # The patched tauri-cli on ubuntu. Empty on Windows, where the action runs `npm run tauri`.
          tauriScript: ${{ env.TAURI_CMD }}
          args: ${{ matrix.args }}

      - name: Bundle Portable Version (Windows only)
        if: matrix.platform == 'windows-latest' || matrix.platform == 'windows-11-arm'
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/release"
          $layoutRoot = "portable-layout"
          $portableFolder = "ovd-portable"

          $pkg = Get-Content -Raw "package.json" | ConvertFrom-Json
          $version = $pkg.version
          
          # Detect architecture
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
          
          $zipName = "Open.Video.Downloader_$($version)_$($arch)-portable.zip"
          $exeName = "Open.Video.Downloader_$($version)_$($arch).exe"
          $keepFileName = ".keep"
          
          $tagName = "app-v$version"
          Write-Host "Building portable bundle for $arch architecture: $zipName"
          Write-Host "Using release tag: $tagName"
          
          $exe = Get-ChildItem -Path $releaseDir -Filter "*.exe" | Where-Object { $_.Name -notmatch "setup" } | Select-Object -First 1
          if (-not $exe) { Write-Error "Could not find main exe in $releaseDir" }
          
          New-Item -ItemType Directory -Path "$layoutRoot/$portableFolder" -Force | Out-Null
          New-Item -ItemType File -Path "$layoutRoot/$portableFolder/$keepFileName" -Value "Do not remove this file or directory." -Force | Out-Null
          Copy-Item $exe.FullName -Destination "$layoutRoot/$exeName" -Force
          
          Compress-Archive -Path "$layoutRoot/*" -DestinationPath $zipName -Force
      
          echo "PORTABLE_ASSET=$zipName" >> $env:GITHUB_ENV
          echo "RELEASE_TAG=$tagName" >> $env:GITHUB_ENV

      - name: Upload Portable (Windows only)
        if: matrix.platform == 'windows-latest' || matrix.platform == 'windows-11-arm'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading ${PORTABLE_ASSET} to release ${RELEASE_TAG}"
          gh release upload "${RELEASE_TAG}" "${PORTABLE_ASSET}" --clobber
