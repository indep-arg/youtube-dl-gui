name: CI Rust

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rust-ci.yml'
      - '.github/actions/install-tauri-deps/**'
      - 'src-tauri/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/rust-ci.yml'
      - '.github/actions/install-tauri-deps/**'
      - 'src-tauri/**'

  # Also called by publish.yml, so a release only builds once the same checks pass.
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: 'Lint'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      TAURI_SKIP_UPDATE_CHECK: 1
      CARGO_TARGET_DIR: src-tauri/target
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js for isolation build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Build isolation frontend
        run: |
          npm ci
          npm run build:isolation

      - name: Install system dependencies for Tauri
        uses: ./.github/actions/install-tauri-deps

      - name: Cache Rust registry
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Cache Rust build artifacts
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: Set up Rust toolchain (1.99.1 + Clippy)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # rust-toolchain action
        with:
          toolchain: 1.99.1
          components: clippy,rustfmt

      - name: Run clippy
        run: cargo clippy --manifest-path=src-tauri/Cargo.toml --all-features --all-targets --locked -- -D warnings

      - name: Run cargo fmt
        run: cargo fmt --manifest-path=src-tauri/Cargo.toml --all -- --check

  unit-tests:
    name: 'Unit Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      TAURI_SKIP_UPDATE_CHECK: 1
      CARGO_TARGET_DIR: src-tauri/target
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js for isolation build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Build isolation frontend
        run: |
          npm ci
          npm run build:isolation

      - name: Install system dependencies for Tauri
        uses: ./.github/actions/install-tauri-deps

      - name: Cache Rust registry
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('src-tauri/Cargo.toml') }}

      - name: Cache Rust build artifacts
        if: ${{ github.event_name == 'push' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: Set up Rust toolchain (1.99.1 + LLVM tools)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # rust-toolchain action
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate Rust coverage
        run: |
          mkdir -p coverage/rust
          cargo llvm-cov --manifest-path=src-tauri/Cargo.toml --lcov --output-path=coverage/rust/lcov.info --remap-path-prefix --all-features --all-targets --locked

      - name: Upload Rust coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/rust/lcov.info
          flags: rust-units
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true

  # The Windows builds are published too, so they get checked as well.
  windows:
    name: 'Windows'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      TAURI_SKIP_UPDATE_CHECK: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js for isolation build
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Build isolation frontend
        run: |
          npm ci
          npm run build:isolation

      - name: Set up Rust toolchain (1.99.1 + Clippy)
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # rust-toolchain action
        with:
          toolchain: 1.99.1
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: './src-tauri -> target'

      - name: Run clippy
        run: cargo clippy --manifest-path=src-tauri/Cargo.toml --all-features --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --manifest-path=src-tauri/Cargo.toml --all-features --all-targets --locked

      - name: Build
        run: cargo build --manifest-path=src-tauri/Cargo.toml --locked

      # The build embeds the icon and the version information in the .exe; if it
      # went missing it would only show as a blank icon on someone's desktop.
      - name: Check the embedded version information
        shell: pwsh
        run: |
          $info = (Get-Item src-tauri/target/debug/open-video-downloader.exe).VersionInfo
          if ($info.ProductName -ne 'Open Video Downloader') {
            Write-Error "The .exe has no version resource (ProductName: '$($info.ProductName)')"
            exit 1
          }
          "ProductName: $($info.ProductName), FileVersion: $($info.FileVersion)"
