[package]
name = "open-video-downloader"
version = "2026.10.3"
description = "Download videos from all over the web."
license = "AGPL-3.0-or-later"
authors = ["Jelle Glebbeek", "indep-arg"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant, but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "open_video_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = ["isolation"] }

[dependencies]
tauri = { version = "2.12.4", features = ["isolation", "image-png", "tray-icon"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-global-shortcut = "2.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
uuid = { version = "1.28.0", features = ["v4"] }
futures = "0.3.34"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.14.0"
arc-swap = "1.9.2"
tokio = { version = "1.53.3", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json"] }
sha2 = "0.11"
ed25519-dalek = "3.0"
base64 = "0.23"
hex = "0.4"
zip = "9.0.5"
tar = "0.4.46"
bzip2 = "0.6.1"
tauri-plugin-keyring = "0.1.0"
rand = "0.10.3"
tauri-plugin-stronghold = "2.4.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
regex = "1.13.1"
indexmap = { version = "2.14.2", features = ["serde"] }
include_dir = "0.7.4"
sys-locale = "0.3.2"
notify-rust = "4.18.2"
shlex = "2.0.1"
lzma-rust2 = { version = "0.22.0", default-features = false, features = ["std", "xz", "optimization"] }

[dev-dependencies]
tauri = { version = "2.12.4", features = ["test"] }
# Only the tests write .tar.xz files.
lzma-rust2 = { version = "0.22.0", default-features = false, features = ["std", "xz", "encoder"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.dev]
incremental = true

[profile.dev.package.scrypt]
opt-level = 3

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true
opt-level = "s"
panic = "abort"
strip = false
debug = 1
split-debuginfo = "packed"
